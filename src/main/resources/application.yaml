server:
  port: 8001

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eca_cake_shop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    lease-renewal-interval-in-seconds: 1
    lease-expiration-duration-in-seconds: 3
  client:
    registry-fetch-interval-seconds: 1
    initial-instance-info-replication-interval-seconds: 1
    eureka-service-url-poll-interval-seconds: 1
    service-url:
      defaultZone: http://localhost:9001/eureka/
